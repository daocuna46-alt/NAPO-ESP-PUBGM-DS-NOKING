name: Build NAPO-ESP-PUBGM-DS-NOKING IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    name: Build (verify + artifact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List artifacts
        run: ls -la *.ipa

      - name: Verify patches
        run: |
          python3 - <<'EOF'
          import zipfile, struct

          IPA = 'NAPO-ESP-PUBGM-DS-NOKING.ipa'
          with zipfile.ZipFile(IPA) as z:
              d = z.read('Payload/QBL-ESP-PUBGM-DS.app/QBL-ESP-PUBGM-DS')

          def vm_to_off(vm):
              if 0x100000000 <= vm < 0x1002f8000: return vm - 0x100000000
              if 0x1002f8000 <= vm < 0x100308000: return (vm - 0x1002f8000) + 0x2f8000
              if 0x100308000 <= vm < 0x1003e4000: return (vm - 0x100308000) + 0x308000
              return None

          ok = []

          # 1. SwitchToLoginScreen @ 0x10008954c -> b 0x100088768
          off = vm_to_off(0x10008954c)
          insn = struct.unpack_from('<I', d, off)[0]
          assert (insn & 0xfc000000) == 0x14000000, 'SwitchToLogin not B'
          im = insn & 0x3ffffff
          if im >= 0x2000000: im -= 0x4000000
          real_t = (0x10008954c + (im << 2)) & 0xffffffffffffffff
          print('Login gate ->', hex(real_t))
          assert real_t == 0x100088768, 'patch 1 fail'
          ok.append('login->hack')

          # 2. check integrity TLS area zeroed (best effort, print only)
          off2 = 0x352920
          print('TLS @ 0x352920:', d[off2:off2+32].hex())
          ok.append('tls-check')

          print('VERIFIED:', ', '.join(ok))
          EOF

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NAPO-ESP-PUBGM-DS-NOKING
          path: NAPO-ESP-PUBGM-DS-NOKING.ipa
